services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379
      - CHROMA_PERSIST_DIR=/app/data/chromadb
      - SKILLS_DIR=/app/data/skills
      # Forward the host SSH agent so agents can clone private repos via SSH (no token needed).
      # On macOS, SSH_AUTH_SOCK is set automatically — run: export SSH_AUTH_SOCK=$(launchctl getenv SSH_AUTH_SOCK)
      - SSH_AUTH_SOCK=/ssh-agent.sock
    volumes:
      - ./data:/app/data
      - ${SSH_AUTH_SOCK:-/tmp/ssh-agent.sock}:/ssh-agent.sock
      - ~/.ssh/known_hosts:/root/.ssh/known_hosts:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  redis_data:
