services:
  # ---------------------------------------------------------------------------
  # Data services
  # ---------------------------------------------------------------------------

  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: agent_team
      POSTGRES_PASSWORD: agent_team_dev
      POSTGRES_DB: agent_team
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_team -d agent_team"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Create the artifact bucket on first start (idempotent — safe to re-run).
  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb local/agent-artifacts --ignore-existing &&
        echo 'MinIO bucket ready.'
      "
    restart: on-failure

  # ---------------------------------------------------------------------------
  # Backend services
  # ---------------------------------------------------------------------------

  # One-shot migration container — runs alembic upgrade head, then exits.
  # backend/worker/beat depend on this completing successfully.
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      # Override localhost URLs from .env with Docker service names
      DATABASE_URL: postgresql+asyncpg://agent_team:agent_team_dev@postgres:5432/agent_team
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    command: alembic upgrade head
    restart: on-failure

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://agent_team:agent_team_dev@postgres:5432/agent_team
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT_URL: http://minio:9000
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://agent_team:agent_team_dev@postgres:5432/agent_team
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT_URL: http://minio:9000
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: celery -A app.core.celery_app worker --concurrency=1 --loglevel=info
    restart: on-failure

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://agent_team:agent_team_dev@postgres:5432/agent_team
      REDIS_URL: redis://redis:6379
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: celery -A app.core.celery_app beat --loglevel=info
    restart: on-failure

  # ---------------------------------------------------------------------------
  # Frontend
  # ---------------------------------------------------------------------------

  frontend:
    image: node:20-alpine
    ports:
      - "3005:3005"
    working_dir: /app
    environment:
      # API URL for browser-side fetch (host-visible port)
      NEXT_PUBLIC_API_URL: http://localhost:8000
      PORT: "3005"
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_ENV: development
    volumes:
      - ./frontend:/app
      # Isolated node_modules volume — prevents host install from conflicting
      - frontend_modules:/app/node_modules
    depends_on:
      - backend
    command: >
      sh -c "corepack enable pnpm &&
             pnpm install --frozen-lockfile &&
             pnpm dev"

volumes:
  pgdata:
  redisdata:
  miniodata:
  frontend_modules:
